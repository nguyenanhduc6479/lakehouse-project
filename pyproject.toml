[project]
name = "lakehouse-pipeline"
version = "0.1.0"
description = "Pipeline medallion OHLCV (ingest -> bronze -> silver -> gold) cho lakehouse local"
requires-python = ">=3.11"

# Dev deps quản bằng uv (uv sync --group dev / uv run pytest).
# pyspark PIN 3.5.1 để khớp cluster custom-spark:3.5.1 — test logic transform phải chạy
# trên đúng phiên bản Spark với production.
[dependency-groups]
dev = [
    "pyspark==3.5.1",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pandas==2.1.4",
    "pyarrow==15.0.2",
    "boto3>=1.34",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
# Cho pytest import trực tiếp các module job (spark/jobs) và ingest (airflow/plugins)
# mà không cần cài thành package.
pythonpath = ["spark/jobs", "airflow/plugins"]
testpaths = ["tests"]
# Marker 'spark' = test cần SparkSession/JVM. Trên host Windows (python worker hay bị
# "Accept timed out") chạy phần còn lại bằng:  uv run pytest -m "not spark"
# Test Spark chạy trong container Linux:
#   docker compose exec spark-master bash -c "cd /opt/spark/jobs && python -m pytest ..."
markers = ["spark: test cần SparkSession/JVM (chạy trong container Linux)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
