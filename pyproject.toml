[project]
name = "lakehouse-pipeline"
version = "0.1.0"
description = "Pipeline medallion OHLCV (ingest -> bronze -> silver -> gold) cho lakehouse local"
requires-python = ">=3.11"

# Dev deps managed by uv (uv sync --group dev / uv run pytest).
# pyspark PINNED to 3.5.1 to match the custom-spark:3.5.1 cluster — transform logic tests must run
# on the same Spark version as production.
[dependency-groups]
dev = [
    "pyspark==3.5.1",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pandas==2.1.4",
    "pyarrow==15.0.2",
    "boto3>=1.34",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
# Let pytest import the job modules (spark/jobs) and ingest (airflow/plugins) directly
# without installing them as a package.
pythonpath = ["spark/jobs", "airflow/plugins"]
testpaths = ["tests"]
# Marker 'spark' = test needs a SparkSession/JVM. On a Windows host (python workers often hit
# "Accept timed out") run the rest with:  uv run pytest -m "not spark"
# Spark tests run in the Linux container:
#   docker compose exec spark-master bash -c "cd /opt/spark/jobs && python -m pytest ..."
markers = ["spark: test needs a SparkSession/JVM (runs in the Linux container)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
