# --- Event logs: off ---
# Nothing reads them (no Spark History Server). Job logs (driver/executor stdout/stderr) are
# shipped to Loki by Alloy from the worker's work dir instead (compose/spark.yml, config.alloy).
spark.eventLog.enabled                                                      false

# --- master ---
# Required for REST (6066) cluster-mode submits: the worker launches the driver as
# `SparkSubmit <app>` without --master, and SparkSubmit ignores the -Dspark.master system property
# the REST payload turns into, so without this line every job silently runs in local[*] inside
# the driver (log: "Starting executor ID driver"). Explicit .master(...) in code still wins.
spark.master                                                                spark://spark-master:7077

# --- timezone config ---
spark.sql.session.timeZone                                                  Asia/Ho_Chi_Minh
