appender.console.type = console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss.SSS} %p %c{1}: %m%n

# set everything to be logged to the console
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

# set logging level
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = error

logger.datahub.name = datahub
logger.datahub.level = debug
logger.datahub.additivity = false
logger.datahub.appenderRef.console.ref = console

logger.acryl.name = io.acryl
logger.acryl.level = debug
logger.acryl.additivity = false
logger.acryl.appenderRef.console.ref = console