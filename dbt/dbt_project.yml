# Gold layer: dbt-clickhouse builds ClickHouse tables from silver (Postgres), read through the
# ClickHouse named collection `silver_pg` (clickhouse/config.d/named_collections.xml).
# For now every gold model is a full rebuild (materialized: table — dbt-clickhouse builds a new
# table and swaps it in atomically); incremental loads with a watermark come later (design §8).
name: lakehouse
version: "1.0.0"
config-version: 2
profile: lakehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  lakehouse:
    staging:
      +materialized: ephemeral
    gold:
      +materialized: table
