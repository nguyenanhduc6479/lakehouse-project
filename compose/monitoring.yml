# Container log monitoring: Alloy tails the Docker json-file logs of every container of this
# compose project (and Spark job log files) and pushes them to Loki; Grafana reads Loki
# (datasource + dashboard are provisioned).
# Alloy rather than Promtail: Promtail is end-of-life and Grafana points to Alloy as its successor.
# Logging for every container in this module: json-file (the Engine default) plus the compose
# labels written into each line, so Alloy can tail /var/lib/docker/containers/*/*-json.log and know
# which service a line belongs to — even for one-shot jobs that exit in under a second. Size-capped:
# json-file is unbounded by default. Defined per module because YAML anchors don't cross `include`.
x-logging: &default-logging
  driver: json-file
  options:
    labels: "com.docker.compose.project,com.docker.compose.service"
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.yaml"]
    environment:
      TZ: ${TZ}
    volumes:
      - ../monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data_vol:/loki
    networks: [lakehouse]
    # No healthcheck: the image is distroless (no shell/curl/wget). Readiness is checked from
    # alloy's healthcheck instead, and both Alloy and Grafana retry Loki on their own.

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    logging: *default-logging
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
    environment:
      TZ: ${TZ}
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker's json-file container logs (native Docker Engine in WSL); read-only, no Docker API
      # access needed any more (the old docker.sock mount gave full control of the daemon)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data_vol:/var/lib/alloy/data
      # Spark worker work dir: logs of cluster-mode drivers/executors are files, not container stdout
      - spark_work_vol:/spark-work:ro
    depends_on:
      loki:
        condition: service_started
    networks: [lakehouse]
    healthcheck:
      # The image has bash but no curl/wget: probe Alloy's own /-/ready and Loki's /ready
      # over /dev/tcp (bash-only — CMD-SHELL would run dash, which lacks it).
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          for hp in 127.0.0.1:12345:/-/ready loki:3100:/ready; do
          h=$${hp%%:*}; r=$${hp#*:}; p=$${r%%:*}; u=$${r#*:};
          exec 3<>/dev/tcp/$$h/$$p || exit 1;
          printf 'GET %s HTTP/1.0\r\nHost: %s\r\n\r\n' $$u $$h >&3;
          head -1 <&3 | grep -q ' 200 ' || exit 1;
          exec 3<&-; done
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      # probe every 2s during start_period: every root service waits for alloy to be healthy, and
      # without this Docker runs the first check only after `interval` (30s)
      start_interval: 2s

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    logging: *default-logging
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"      # Grafana UI
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data_vol:/var/lib/grafana
    depends_on:
      alloy:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  # declared in compose/spark.yml; repeated so this module stays independently mergeable
  spark_work_vol:
  loki_data_vol:
  alloy_data_vol:
  grafana_data_vol:

networks:
  lakehouse:
    driver: bridge
