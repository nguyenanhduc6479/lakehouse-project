x-airflow-common: &airflow-common
  build:
    context: ../airflow
    dockerfile: Dockerfile
  image: custom-airflow:2.9.2
  # no restart policy for now (local only; restore on a real server): see schema-registry in
  # compose/infra.yml
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # the 'airflow' role owns the 'airflow' DB (created by postgres-setup) — no superuser needed
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_ADMIN_USERNAME}:${AIRFLOW_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB_AIRFLOW}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    # must be identical on webserver and scheduler, otherwise the UI can't fetch task logs
    # served by the scheduler (403 "Could not read served logs")
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    TZ: ${TZ}
    # S3 (RustFS) credentials for tasks that touch object storage — from .env
    S3_ENDPOINT: ${S3_ENDPOINT}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET}
    S3_REGION: ${S3_REGION}
    # dbt (gold): profile in dbt/profiles.yml reads these; target/ and logs/ go to /tmp, not into
    # the bind-mounted project (they would be owned by the container's uid on the host)
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - ../dbt:/opt/airflow/dbt
    - airflow_logs_vol:/opt/airflow/logs
  networks: [lakehouse]

# Logging for every container in this module: json-file (the Engine default) plus the compose
# labels written into each line, so Alloy can tail /var/lib/docker/containers/*/*-json.log and know
# which service a line belongs to — even for one-shot jobs that exit in under a second. Size-capped:
# json-file is unbounded by default. Defined per module because YAML anchors don't cross `include`.
x-logging: &default-logging
  driver: json-file
  options:
    labels: "com.docker.compose.project,com.docker.compose.service"
    max-size: "10m"
    max-file: "3"

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    logging: *default-logging
    # wait for postgres-setup to create the 'airflow' database before running db migrate
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
      # admin user
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # spark REST (cluster mode)
      SPARK_REST_HOST: spark-master
      SPARK_REST_PORT: 6066
      # postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      # trino
      TRINO_HOST: trino
      TRINO_PORT: 8080
    entrypoint: ["/bin/bash", "/opt/airflow/scripts/init.sh"]
    volumes:
      - ../airflow/scripts:/opt/airflow/scripts
      - ../airflow/dags:/opt/airflow/dags
      - ../dbt:/opt/airflow/dbt
      - airflow_logs_vol:/opt/airflow/logs

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    logging: *default-logging
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "webserver"]
    ports:
      - "8085:8080"      # web UI (8085 on host, avoids clashing with Trino 8080)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    logging: *default-logging
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      # dbt tasks (gold) run here (LocalExecutor) against ClickHouse
      clickhouse:
        condition: service_healthy
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\" || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

volumes:
  airflow_logs_vol:

networks:
  lakehouse:
    driver: bridge
