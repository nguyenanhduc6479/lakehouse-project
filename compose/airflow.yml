x-airflow-common: &airflow-common
  build:
    context: ../airflow
    dockerfile: Dockerfile
  image: custom-airflow:2.9.2
  restart: on-failure
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_AIRFLOW}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    TZ: Asia/Ho_Chi_Minh
    # MinIO cho task ingest (chạy trong scheduler) ghi parquet landing — lấy từ .env
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - ../dbt:/opt/airflow/dbt
    - airflow_logs_vol:/opt/airflow/logs
  networks: [lakehouse]

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # chờ postgres-setup tạo database 'airflow' trước khi chạy db migrate
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
      # admin user
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # spark REST (cluster mode)
      SPARK_REST_HOST: spark-master
      SPARK_REST_PORT: 6066
      # minio
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      # postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      # trino
      TRINO_HOST: trino
      TRINO_PORT: 8080
      # datahub
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
    entrypoint: ["/bin/bash", "/opt/airflow/scripts/init.sh"]
    volumes:
      - ../airflow/scripts:/opt/airflow/scripts
      - ../airflow/dags:/opt/airflow/dags
      - ../dbt:/opt/airflow/dbt
      - airflow_logs_vol:/opt/airflow/logs

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "webserver"]
    ports:
      - "8085:8080"      # web UI (8085 host, tránh đụng Trino 8080)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\" || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

volumes:
  airflow_logs_vol:

networks:
  lakehouse:
    driver: bridge
