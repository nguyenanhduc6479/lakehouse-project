# ClickHouse: the gold layer (OLAP). dbt (in the Airflow containers) builds gold from silver,
# reading Postgres through the named collection `silver_pg`; Superset reads gold as the read-only
# user `superset_reader`. Single node, no Keeper/replication.
# Logging for every container in this module: json-file (the Engine default) plus the compose
# labels written into each line, so Alloy can tail /var/lib/docker/containers/*/*-json.log and know
# which service a line belongs to — even for one-shot jobs that exit in under a second. Size-capped:
# json-file is unbounded by default. Defined per module because YAML anchors don't cross `include`.
x-logging: &default-logging
  driver: json-file
  options:
    labels: "com.docker.compose.project,com.docker.compose.service"
    max-size: "10m"
    max-file: "3"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    container_name: clickhouse
    logging: *default-logging
    depends_on:
      # start only once log shipping works (see compose/monitoring.yml)
      alloy:
        condition: service_healthy
    environment:
      # admin user (replaces `default`), with SQL access management; dbt writes gold with it.
      # The name is fixed: clickhouse/users.d/admin.xml adds rights to the user of this name.
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # read by the from_env attributes in clickhouse/config.d and users.d
      POSTGRES_DB: ${POSTGRES_DB}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD}
      TZ: ${TZ}
    # config files are mounted one by one: mounting the whole config.d would hide the image's
    # docker_related_config.xml (listen_host 0.0.0.0). After editing one, use
    # `docker compose up -d --force-recreate clickhouse` (a plain restart can fail on the inode).
    volumes:
      - ../clickhouse/config.d/logger.xml:/etc/clickhouse-server/config.d/logger.xml:ro
      - ../clickhouse/config.d/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - ../clickhouse/users.d/admin.xml:/etc/clickhouse-server/users.d/admin.xml:ro
      - ../clickhouse/users.d/superset_reader.xml:/etc/clickhouse-server/users.d/superset_reader.xml:ro
      - clickhouse_data_vol:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # HTTP only; the native port 9000 stays internal (9000 on the host is RustFS)
    ports: ["8123:8123"]
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
      start_interval: 2s

volumes:
  clickhouse_data_vol:

networks:
  lakehouse:
    driver: bridge
