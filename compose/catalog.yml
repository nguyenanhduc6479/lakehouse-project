# Logging for every container in this module: json-file (the Engine default) plus the compose
# labels written into each line, so Alloy can tail /var/lib/docker/containers/*/*-json.log and know
# which service a line belongs to — even for one-shot jobs that exit in under a second. Size-capped:
# json-file is unbounded by default. Defined per module because YAML anchors don't cross `include`.
x-logging: &default-logging
  driver: json-file
  options:
    labels: "com.docker.compose.project,com.docker.compose.service"
    max-size: "10m"
    max-file: "3"

services:
  # The relational-jdbc backend REQUIRES bootstrapping schema + realm with admin-tool before
  # starting the server (Polaris 1.5.0 docs: metastores/relational-jdbc.md).
  # The docs claim the command is idempotent, but on 1.5.0 a 2nd run -> exit 3 "already been
  # bootstrapped" -> every later `up` would block polaris. So wrap it in sh: treat exactly that
  # error as OK, other errors still fail. Pinned to the server version so the DB schema matches.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.5.0
    container_name: polaris-bootstrap
    logging: *default-logging
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_POLARIS}
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_ADMIN_USERNAME}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_ADMIN_PASSWORD}
      POLARIS_SECRET: ${POLARIS_SECRET}
    entrypoint: ["sh", "-c"]
    command:
      - |
        out=$$(java -jar /deployments/polaris-admin-tool.jar bootstrap --realm=POLARIS \
          --credential="POLARIS,root,$$POLARIS_SECRET" 2>&1); rc=$$?
        echo "$$out" | grep -v '^[[:space:]]*at '
        if [ "$$rc" -ne 0 ] && echo "$$out" | grep -q 'already been bootstrapped'; then
          echo "Realm POLARIS already bootstrapped -> skipping."; exit 0
        fi
        exit "$$rc"
    networks: [lakehouse]

  polaris:
    image: apache/polaris:1.5.0
    container_name: polaris
    logging: *default-logging
    depends_on:
      # wait for bootstrap to create schema/realm in the 'polaris' database (after postgres-setup)
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,${POLARIS_SECRET}
      # By default Polaris uses an in-memory metastore (log: "intended for tests only") -> every
      # catalog/table is lost on restart. relational-jdbc must be on for quarkus.datasource to apply.
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB_POLARIS}
      quarkus.datasource.username: ${POLARIS_ADMIN_USERNAME}
      quarkus.datasource.password: ${POLARIS_ADMIN_PASSWORD}
      quarkus.datasource.db-kind: postgresql
      # The catalog sets stsUnavailable=true (no STS) -> Polaris reads/writes metadata.json on
      # RustFS itself via the default AWS credential chain, so it needs keys + region.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
      TZ: ${TZ}
    ports: ["8181:8181"]
    networks: [lakehouse]
    healthcheck:
      # Polaris 1.5.0 (Quarkus 3.x): /q/health is on management port 8182, not main port 8181
      test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  polaris-setup:
    image: alpine:3.19
    container_name: polaris-setup
    logging: *default-logging
    depends_on:
      polaris:
        condition: service_healthy
      # wait for rustfs-setup to create the bucket before registering the location with Polaris
      rustfs-setup:
        condition: service_completed_successfully
    environment:
      POLARIS_HOST: polaris
      POLARIS_PORT: 8181
      POLARIS_CLIENT_ID: root
      POLARIS_CLIENT_SECRET: ${POLARIS_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
    volumes:
      - ../polaris/scripts:/scripts
    command: ["sh", "-c", "apk add --no-cache curl && sh /scripts/init.sh"]
    networks: [lakehouse]

networks:
  lakehouse:
    driver: bridge
