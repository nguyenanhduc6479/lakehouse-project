services:
  minio:
    image: minio/minio
    container_name: minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - minio_data_vol:/data
    networks: [lakehouse]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ../minio/scripts/init.sh:/init.sh
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [lakehouse]

volumes:
  minio_data_vol:

networks:
  lakehouse:
    driver: bridge
