# source-db: the simulated OLTP source for CDC. A separate instance from the shared `postgres`
# (infra.yml) on purpose: wal_level=logical and the replication slot's WAL retention apply to the
# whole instance, and CDC experiments (stopping Debezium, schema changes, resets) must not touch
# Airflow/Polaris/silver.
# Logging for every container in this module: json-file (the Engine default) plus the compose
# labels written into each line, so Alloy can tail /var/lib/docker/containers/*/*-json.log and know
# which service a line belongs to — even for one-shot jobs that exit in under a second. Size-capped:
# json-file is unbounded by default. Defined per module because YAML anchors don't cross `include`.
x-logging: &default-logging
  driver: json-file
  options:
    labels: "com.docker.compose.project,com.docker.compose.service"
    max-size: "10m"
    max-file: "3"

services:
  source-db:
    image: postgres:16
    container_name: source-db
    logging: *default-logging
    depends_on:
      # start only once log shipping works, so Alloy -> Loki captures this service (and everything
      # that depends on it) from its first line; Alloy's healthcheck also probes Loki
      alloy:
        condition: service_healthy
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      # cap the WAL an unread replication slot may hold, so a stopped Debezium can't fill the disk
      - "-c"
      - "max_slot_wal_keep_size=1GB"
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
      TZ: ${TZ}
    ports: ["5433:5432"]      # 5433 on host: 5432 is the shared postgres
    volumes:
      - source_db_data_vol:/var/lib/postgresql/data
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_POSTGRES_USER} -d ${SOURCE_POSTGRES_DB}"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 5s

volumes:
  source_db_data_vol:

networks:
  lakehouse:
    driver: bridge
