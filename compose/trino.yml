services:
  trino:
    # >= 454: bản đầu tiên có iceberg.rest-catalog.oauth2.scope — Polaris bắt buộc
    # scope PRINCIPAL_ROLE:ALL, 435 không set được nên bị invalid_scope.
    image: trinodb/trino:454
    container_name: trino
    environment:
      POLARIS_SECRET: ${POLARIS_SECRET}
      # trino/catalog/lakehouse.properties đọc qua ${ENV:...} để truy cập data file trên MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["8080:8080"]
    volumes:
      - ../trino/catalog:/etc/trino/catalog
    depends_on:
      polaris:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

networks:
  lakehouse:
    driver: bridge
