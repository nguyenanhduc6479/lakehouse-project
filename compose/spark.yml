# Logging for every container in this module: json-file (the Engine default) plus the compose
# labels written into each line, so Alloy can tail /var/lib/docker/containers/*/*-json.log and know
# which service a line belongs to — even for one-shot jobs that exit in under a second. Size-capped:
# json-file is unbounded by default. Defined per module because YAML anchors don't cross `include`.
x-logging: &default-logging
  driver: json-file
  options:
    labels: "com.docker.compose.project,com.docker.compose.service"
    max-size: "10m"
    max-file: "3"

services:
  spark-master:
    build:
      context: ../spark
      dockerfile: Dockerfile
    image: custom-spark:3.5.1
    container_name: spark-master
    logging: *default-logging
    depends_on:
      # start only once log shipping works, so Alloy -> Loki captures this service (and everything
      # that depends on it) from its first line; Alloy's healthcheck also probes Loki
      alloy:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_OPTS: "-Dspark.master.rest.enabled=true -Dspark.master.rest.port=6066"
      TZ: ${TZ}
      # config read by jobs in helper.py (Polaris REST catalog + RustFS S3) — from .env
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      POLARIS_SECRET: ${POLARIS_SECRET}
      POLARIS_URI: http://polaris:8181/api/catalog
      # JDBC to the data-platform DB (helper.postgres_jdbc_options): silver / staging / config
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "7077:7077"      # master RPC
      - "8090:8080"      # master web UI (8090 on host, avoids clashing with Trino 8080)
      - "6066:6066"      # REST API for cluster-mode submit
    volumes:
      - ../spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ../spark/jobs:/opt/spark/jobs
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  spark-worker:
    image: custom-spark:3.5.1
    container_name: spark-worker
    logging: *default-logging
    # the driver runs on the worker (cluster mode), so it needs Polaris/S3 env for helper.py
    environment:
      TZ: ${TZ}
      # delete work dirs of finished applications after 7 days (checked every 30 min)
      SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=1800 -Dspark.worker.cleanup.appDataTtl=604800"
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      POLARIS_SECRET: ${POLARIS_SECRET}
      POLARIS_URI: http://polaris:8181/api/catalog
      # JDBC to the data-platform DB (helper.postgres_jdbc_options): silver / staging / config
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
      # sized in .env; must fit one pipeline job (driver + executor, cluster mode)
      - "--cores"
      - "${SPARK_WORKER_CORES}"
      - "--memory"
      - "${SPARK_WORKER_MEMORY}"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"      # worker web UI
    volumes:
      - ../spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ../spark/jobs:/opt/spark/jobs
      # driver-*/ and app-*/<executor>/ stdout+stderr of cluster-mode jobs; Alloy tails it (read-only)
      - spark_work_vol:/opt/spark/work
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  spark_work_vol:

networks:
  lakehouse:
    driver: bridge
