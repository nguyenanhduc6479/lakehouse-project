# DataHub v0.12.1 — mapped from the official quickstart (which uses MySQL) onto this repo's existing infra:
#   - DB: Postgres (database 'datahub' created by postgres-setup in infra.yml) instead of MySQL
#   - Kafka broker: service 'kafka' (advertised kafka:29092) instead of 'broker'
#   - DataHub topics: pre-created by 'kafka-setup' in infra.yml
#   - Graph store: Elasticsearch (GRAPH_SERVICE_IMPL=elasticsearch) — the repo has no Neo4j
# Pinned to v0.12.1 to match acryl-datahub[airflow]==0.12.1.5 in airflow/requirements.txt.
# Env vars taken verbatim from docker/quickstart/docker-compose-without-neo4j.quickstart.yml and
# docker/datahub-gms/env/docker.postgres.env at tag v0.12.1.

services:
  # --- Confluent Schema Registry (required by the quickstart; infra.yml doesn't ship it) ---
  # Named 'schema-registry' to match the URL http://schema-registry:8081 used by GMS/upgrade/actions.
  # CP 7.6.0 to stay in sync with kafka/zookeeper 7.6.0 in infra.yml. No host port published
  # (8081 is taken by the spark-worker UI) — in-network access only is enough.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schemaregistry
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --- ES setup: create index templates/policies for DataHub ---
  datahub-elasticsearch-setup:
    image: linkedin/datahub-elasticsearch-setup:v0.12.1
    container_name: datahub-elasticsearch-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      USE_AWS_ELASTICSEARCH: "false"
    networks: [lakehouse]

  # --- Postgres setup: create table metadata_aspect_v2 + seed the default user in DB 'datahub' ---
  # DB 'datahub' is created by postgres-setup (infra.yml); this image's init.sh checks existence
  # before CREATE, so it skips creating the DB and only runs init.sql to create tables.
  datahub-postgres-setup:
    image: acryldata/datahub-postgres-setup:v0.12.1
    container_name: datahub-postgres-setup
    depends_on:
      # depends on postgres-setup in infra.yml so DB 'datahub' and its role already exist
      postgres-setup:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ${DATAHUB_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${DATAHUB_ADMIN_PASSWORD}
      DATAHUB_DB_NAME: ${POSTGRES_DB_DATAHUB}
    networks: [lakehouse]

  # --- System Update job: build/migrate index schemas before GMS starts ---
  datahub-upgrade:
    image: acryldata/datahub-upgrade:v0.12.1
    container_name: datahub-upgrade
    command: ["-u", "SystemUpdate"]
    depends_on:
      datahub-elasticsearch-setup:
        condition: service_completed_successfully
      datahub-postgres-setup:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      # DataHub topics are created by kafka-setup (infra.yml)
      kafka-setup:
        condition: service_completed_successfully
    environment:
      EBEAN_DATASOURCE_USERNAME: ${DATAHUB_ADMIN_USERNAME}
      EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_ADMIN_PASSWORD}
      EBEAN_DATASOURCE_HOST: postgres:5432
      EBEAN_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_DATAHUB}
      EBEAN_DATASOURCE_DRIVER: org.postgresql.Driver
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES: "false"
      GRAPH_SERVICE_IMPL: elasticsearch
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      BACKFILL_BROWSE_PATHS_V2: "true"
      REPROCESS_DEFAULT_BROWSE_PATHS_V2: "false"
    networks: [lakehouse]

  # --- GMS: metadata backend (MAE/MCE/PE consumers embedded) ---
  datahub-gms:
    image: linkedin/datahub-gms:v0.12.1
    container_name: datahub-gms
    restart: on-failure
    depends_on:
      datahub-upgrade:
        condition: service_completed_successfully
    ports:
      - "8083:8080"      # GMS API (8083 on host — 8080 is taken by Trino)
    environment:
      DATAHUB_SERVER_TYPE: quickstart
      DATAHUB_TELEMETRY_ENABLED: "true"
      DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID: generic-duhe-consumer-job-client-gms
      EBEAN_DATASOURCE_USERNAME: ${DATAHUB_ADMIN_USERNAME}
      EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_ADMIN_PASSWORD}
      EBEAN_DATASOURCE_HOST: postgres:5432
      EBEAN_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_DATAHUB}
      EBEAN_DATASOURCE_DRIVER: org.postgresql.Driver
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ES_BULK_REFRESH_POLICY: WAIT_UNTIL
      GRAPH_SERVICE_DIFF_MODE_ENABLED: "true"
      GRAPH_SERVICE_IMPL: elasticsearch
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
      JAVA_OPTS: "-Xms1g -Xmx1g"
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      PE_CONSUMER_ENABLED: "true"
      UI_INGESTION_ENABLED: "true"
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

  # --- Frontend: DataHub UI ---
  datahub-frontend-react:
    image: linkedin/datahub-frontend-react:v0.12.1
    container_name: datahub-frontend-react
    restart: on-failure
    depends_on:
      datahub-gms:
        condition: service_healthy
    ports:
      - "9002:9002"      # DataHub UI
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_SECRET: ${DATAHUB_SECRET_KEY}
      DATAHUB_APP_VERSION: "1.0"
      DATAHUB_PLAY_MEM_BUFFER_SIZE: 10MB
      JAVA_OPTS: "-Xms512m -Xmx512m -Dhttp.port=9002 -Dconfig.file=datahub-frontend/conf/application.conf -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf -Dlogback.configurationFile=datahub-frontend/conf/logback.xml -Dlogback.debug=false -Dpidfile.path=/dev/null"
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      DATAHUB_TRACKING_TOPIC: DataHubUsageEvent_v1
      ELASTIC_CLIENT_HOST: elasticsearch
      ELASTIC_CLIENT_PORT: "9200"
    networks: [lakehouse]

  # --- Actions: ingestion/automation framework ---
  # acryldata/datahub-actions has its OWN version line, not v0.12.1. Pinned to v0.0.14: the
  # actions release current when DataHub 0.12.1 shipped (actions v0.0.14 released 2023-10-28,
  # DataHub 0.12.1 on 2023-12-08; the next one, v0.0.15, only arrived in 2024-02).
  datahub-actions:
    image: acryldata/datahub-actions:v0.0.14
    container_name: datahub-actions
    restart: on-failure
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      ACTIONS_CONFIG: ""
      ACTIONS_EXTRA_PACKAGES: ""
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_GMS_PROTOCOL: http
      DATAHUB_SYSTEM_CLIENT_ID: __datahub_system
      DATAHUB_SYSTEM_CLIENT_SECRET: JohnSnowKnowsNothing
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      METADATA_AUDIT_EVENT_NAME: MetadataAuditEvent_v4
      METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME: MetadataChangeLog_Versioned_v1
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks: [lakehouse]

networks:
  lakehouse:
    driver: bridge
